# Local development overrides (applied automatically by `docker compose up`).
# Bind-mounted source, Django runserver, DEBUG=True, no Nginx.

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    # Distinct tag per mode — see docker-compose.yml.
    image: automex-carflow:dev
    command: runserver
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      # Host port for the dev server (see DEV_PORT in .env); container side stays 8000.
      - "${DEV_PORT:-8765}:8000"

  worker:
    # Same dev image as web (built once by the web service).
    image: automex-carflow:dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app
      - media_data:/app/media

  beat:
    image: automex-carflow:dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - .:/app

  # Dev talks to Django directly on :8000 — Nginx is production-only.
  # Assigning a never-selected profile keeps the service defined but dormant.
  nginx:
    profiles:
      - prod-only
