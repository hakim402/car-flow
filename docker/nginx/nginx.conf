# Nginx reverse proxy for production: serves static/media directly from the
# shared volumes and proxies application requests to Gunicorn on `web:8000`.
#
# `web` must be resolved through Docker's embedded DNS (127.0.0.11) at
# request time. A static `upstream` block resolves the container IP only
# ONCE at nginx startup, so any `web` container recreate (deploy, rebuild,
# crash restart that assigns a new IP) leaves nginx talking to a dead
# address and every request fails with 502 until nginx itself restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# Pass through the scheme reported by the TLS-terminating proxy in front of
# us (host nginx / load balancer). Using $scheme here would always say
# "http" — the front proxy talks to us unencrypted — and Django's
# SECURE_PROXY_SSL_HEADER would never see https (broken secure sessions).
map $http_x_forwarded_proto $carflow_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        # Variable proxy_pass forces per-request DNS resolution through the
        # `resolver` above (a literal hostname would still be resolved only
        # once at startup — the recurring 502 after `web` recreates).
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $carflow_forwarded_proto;
        proxy_redirect off;
    }
}
