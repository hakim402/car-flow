{% load i18n %}
{% for field in form %}
    <div class="mb-4">
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1">
            {{ field.label }}{% if field.field.required %} <span class="text-red-600">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}
            <p class="mt-1 text-sm text-red-700">{{ error }}</p>
        {% endfor %}
    </div>
{% endfor %}
{% if form.non_field_errors %}
    <div class="mb-4 rounded border border-red-300 bg-red-50 px-4 py-2 text-sm text-red-800">
        {{ form.non_field_errors }}
    </div>
{% endif %}
