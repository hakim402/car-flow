# Test configuration — mandatory gates (agent.md §10 Step 12).
# Local:  .\.venv\Scripts\python -m pytest
# Docker: docker compose run --rm web pytest
# config.settings.test keeps every *_ENABLED flag off with empty credentials,
# so the suite itself IS the integrations-off boot gate.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
# Compose sets DJANGO_SETTINGS_MODULE for the long-running web role.  A
# command-line --ds option has higher precedence than that environment value,
# ensuring the documented Docker pytest commands always use isolated settings.
addopts = -ra --ds=config.settings.test
testpaths = apps
