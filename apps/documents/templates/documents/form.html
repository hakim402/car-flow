{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ title }} — AUTOMEX CarFlow{% endblock %}

{% block content %}
<h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 mb-4">{{ title }}</h1>
<div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 shadow-sm max-w-2xl">
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% include "includes/_form_fields.html" %}
        <button type="submit"
                class="inline-flex items-center justify-center rounded-xl bg-amber-500 hover:bg-amber-600 text-white px-4 py-2.5 text-sm font-bold shadow-sm transition">
            {% translate "Upload" %}
        </button>
        <a href="{% if vehicle %}{{ vehicle.get_absolute_url }}{% elif customer %}{{ customer.get_absolute_url }}{% elif supplier %}{{ supplier.get_absolute_url }}{% else %}{% url 'documents:list' %}{% endif %}"
           class="ms-3 text-sm text-slate-500 hover:text-slate-800">
            {% translate "Cancel" %}
        </a>
    </form>
</div>
{% endblock %}
