{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ title }} — AUTOMEX CarFlow{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-4">{{ title }}</h1>
<div class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% include "includes/_form_fields.html" %}
        <button type="submit"
                class="rounded bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 text-sm">
            {% translate "Upload" %}
        </button>
        <a href="{% if vehicle %}{{ vehicle.get_absolute_url }}{% elif customer %}{{ customer.get_absolute_url }}{% elif supplier %}{{ supplier.get_absolute_url }}{% else %}{% url 'documents:list' %}{% endif %}"
           class="ms-3 text-sm text-slate-500 hover:text-slate-800">
            {% translate "Cancel" %}
        </a>
    </form>
</div>
{% endblock %}
