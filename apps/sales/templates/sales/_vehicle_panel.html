{% load i18n %}
<a href="{{ vehicle.get_absolute_url }}" class="group block overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:border-brand-300 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-brand-500/50">
    <div class="relative aspect-[16/9] overflow-hidden bg-slate-100 dark:bg-slate-800">
        {% if vehicle.primary_photo %}<img src="{{ vehicle.primary_photo.file.url }}" alt="{{ vehicle.year }} {{ vehicle.make }} {{ vehicle.model }}" width="720" height="405" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]">{% else %}<div class="flex h-full flex-col items-center justify-center gap-2 text-slate-400"><svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="m5 17-2-1v-4l2-5h14l2 5v4l-2 1M5 12h14M7 15h.01M17 15h.01M6 17v2M18 17v2"/></svg><span class="text-xs font-bold">{% translate "No vehicle photo" %}</span></div>{% endif %}
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950/90 via-slate-950/50 to-transparent px-5 pb-4 pt-14 text-white"><p class="text-xs font-semibold text-white/70">{{ vehicle.year }}</p><h2 class="mt-0.5 text-xl font-extrabold">{{ vehicle.make }} {{ vehicle.model }}</h2></div>
    </div>
    <div class="grid grid-cols-2 gap-3 p-4 text-xs"><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><p class="font-bold uppercase tracking-wide text-slate-400">VIN</p><p class="mt-1 truncate font-mono font-semibold text-slate-700 dark:text-slate-200" dir="ltr">{{ vehicle.vin }}</p></div><div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><p class="font-bold uppercase tracking-wide text-slate-400">{% translate "Mileage" %}</p><p class="mt-1 font-extrabold text-slate-800 dark:text-slate-100" dir="ltr">{{ vehicle.mileage }} {% translate "km" %}</p></div></div>
</a>
