<span class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-bold
    {% if status == 'completed' or status == 'converted' or status == 'accepted' or status == 'paid' or status == 'delivered' %}border-emerald-200 bg-emerald-50 text-emerald-700 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300
    {% elif status == 'active' or status == 'qualified' or status == 'sent' or status == 'contacted' %}border-brand-200 bg-brand-50 text-brand-700 dark:border-brand-400/30 dark:bg-brand-500/10 dark:text-brand-300
    {% elif status == 'partial' or status == 'reserved' %}border-amber-200 bg-amber-50 text-amber-700 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300
    {% elif status == 'lost' or status == 'declined' or status == 'cancelled' or status == 'expired' or status == 'unpaid' %}border-red-200 bg-red-50 text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300
    {% else %}border-slate-200 bg-slate-50 text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300{% endif %}">
    <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>{{ label }}
</span>
