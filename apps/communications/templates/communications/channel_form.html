{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ title }} — AUTOMEX CarFlow{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-4">{{ title }}</h1>
<div class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/_form_fields.html" %}
        <button type="submit"
                class="rounded bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 text-sm">
            {% translate "Save" %}
        </button>
        <a href="{% url 'communications:channel_list' %}" class="ms-3 text-sm text-slate-500 hover:text-slate-800">
            {% translate "Cancel" %}
        </a>
    </form>
</div>
{% endblock %}
