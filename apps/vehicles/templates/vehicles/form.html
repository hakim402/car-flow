{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ title }} — AUTOMEX CarFlow{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-4">{{ title }}</h1>
<form method="post" class="bg-white rounded-lg shadow p-6 max-w-2xl">
    {% csrf_token %}
    {% include "includes/_form_fields.html" %}
    <div class="flex items-center gap-3">
        <button type="submit" class="rounded bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 text-sm">
            {% translate "Save" %}
        </button>
        <a href="{% url 'vehicles:list' %}" class="text-sm text-slate-500 hover:text-slate-800">
            {% translate "Cancel" %}
        </a>
    </div>
</form>
{% endblock %}
