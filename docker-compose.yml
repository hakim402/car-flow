# Base compose file — usable in production.
# Local development adds docker-compose.override.yml automatically.
# web / worker / beat share ONE image; only their `command` differs.
# No secrets live here — everything sensitive comes from .env via env_file.

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: runtime
    # Distinct tag per mode: dev and prod must never overwrite each other's
    # image (a stale dev tag under the shared name boots without app code
    # and dies instantly -> nginx 502).
    image: automex-carflow:prod
    command: web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - static_files:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: automex-carflow:prod
    command: worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: automex-carflow:prod
    command: beat
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_data:/app/media:ro
    ports:
      # Host port for Nginx (see NGINX_PORT in .env); container side stays 80.
      - "${NGINX_PORT:-8765}:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_data:
